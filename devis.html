   <main>


    <div class="main-container">
        <div class="main-container-header">
            <h2>Contactez-Nous</h2>
        </div>
        
        <form class="contact-form" action="#" method="post">
        <div class="form-row">
            
            <div class="nom">
                 <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>

            </div>
            <div class="email">
                <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>
            </div>
           <div class="telephone">
             
            <label for="telephone">Telephone :</label>
            <input type="telephone" id="telephone" name="telephone" required>
           </div>

        </div>
        <div class="message">
           <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" required placeholder="Décrivez-nous votre projet"></textarea>
 
        </div>


    <div class="form-footer">

       
            

            <div class="conditions">
                 <input type="checkbox" name="accept" required>
         *Champs obligatoires. En cochant cette case, j'accepte les conditions particulières ci-dessous

            </div>

        <div class="envoyer">
             <button type="submit">Envoyer le message</button>
        </div>
    

    </div>
        </form>
         
</main>
